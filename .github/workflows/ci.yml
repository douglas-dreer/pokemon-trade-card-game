# .github/workflows/ci.yml

name: CI/CD Pipeline Profissional

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Rodar Testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pokemon_tcg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Gradle com Caching Inteligente
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Dar permissão de execução para o gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes e gerar relatório de cobertura
        run: ./gradlew test integrationTest jacocoTestReport --continue
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pokemon_tcg_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpassword

      - name: Enviar resultados dos testes como artefato
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/
            build/test-results/
          retention-days: 30

      - name: Enviar relatório de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: |
            build/reports/jacoco/test/jacocoTestReport.xml
            build/reports/jacoco/test/html/
          retention-days: 30

  build:
    name: 📦 Construir Aplicação e Imagem Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Gradle com Caching Inteligente
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Dar permissão de execução para o gradlew
        run: chmod +x ./gradlew

      - name: Construir a aplicação com Gradle
        run: ./gradlew build -x test

      - name: Construir Imagem Docker com Spring Boot
        run: ./gradlew bootBuildImage --imageName ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Enviar build como artefato
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 7

  quality:
    name: 📊 Análise de Qualidade de Código
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Gradle com Caching Inteligente
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Dar permissão de execução para o gradlew
        run: chmod +x ./gradlew

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/

      - name: Baixar resultados dos testes
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: build/

      - name: Rodar análise do SonarQube
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info
        continue-on-error: false

      - name: Verificar Quality Gate do SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@master
        if: always()
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  security:
    name: 🛡️ Análise de Segurança
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Gradle com Caching Inteligente
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Dar permissão de execução para o gradlew
        run: chmod +x ./gradlew

      - name: Rodar análise de vulnerabilidades (OWASP)
        run: ./gradlew dependencyCheckAnalyze --info
        continue-on-error: true

      - name: Enviar relatório de segurança
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: build/reports/dependency-check-report.html
          retention-days: 30

  publish:
    name: 🚀 Publicar Imagem no GHCR
    runs-on: ubuntu-latest
    needs: [ build, quality, security ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configurar Gradle com Caching Inteligente
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Dar permissão de execução para o gradlew
        run: chmod +x ./gradlew

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e Publicar a imagem Docker
        run: |
          ./gradlew bootBuildImage \
            --imageName ${{ env.IMAGE_NAME }}:latest \
            --imageName ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --publishImage

      - name: Criar tag da versão
        run: |
          echo "IMAGE_TAG=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "IMAGE_SHA=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Imagem Docker publicada com sucesso!" >> $GITHUB_STEP_SUMMARY
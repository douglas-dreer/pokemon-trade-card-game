# Configuração do SonarCloud
sonar.organization=douglas-dreer
sonar.projectKey=douglas-dreer_pokemon-trade-card-game
sonar.projectName=Pokemon Trading Card Game API
# Configurações do código fonte
sonar.sources=src/main/kotlin,src/main/java
sonar.tests=src/test/kotlin,src/test/java
sonar.java.binaries=build/classes/kotlin/main,build/classes/java/main
sonar.java.test.binaries=build/classes/kotlin/test,build/classes/java/test
# Relatórios de cobertura
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test,build/test-results/integrationTest
# Configurações adicionais
sonar.sourceEncoding=UTF-8
sonar.java.source=21
# Exclusões (ajuste conforme necessário)
sonar.exclusions=**/build/**,**/generated/**,**/*Application.kt,**/*Config.kt
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/*Application.kt